[project]
name = "nordly-support-agent"
version = "0.1.0"
description = "Production AI support agent for Nordly, a European B2B CRM company"
requires-python = ">=3.12"
authors = [
    { name = "Nordly AI Engineering", email = "ai-engineering@nordly.io" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["support", "ai-agent", "fastapi", "openai-agents-sdk", "customer-support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.35.0",
    "openai-agents>=0.21.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-instrumentation-fastapi>=0.57b0",
    "opentelemetry-instrumentation-psycopg>=0.57b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
nordly-agent = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "openai: marks tests that call OpenAI API",
]
