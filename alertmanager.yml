global:
  resolve_timeout: 5m

route:
  receiver: local-log-only
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log-only

# The default receiver intentionally sends no external notifications. Configure a
# secret-backed webhook or SMTP receiver as described in docs/monitoring.md.
