name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_validation:
        description: Validate the production artifact and Compose configuration
        required: true
        type: boolean
        default: false
      environment:
        description: GitHub environment used for manual validation approval
        required: true
        type: choice
        options: [production]
        default: production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: nordly-support-agent

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_DB: nordly_test
          POSTGRES_USER: nordly
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nordly -d nordly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://nordly:ci-only-password@127.0.0.1:5432/nordly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-production.txt pytest pytest-asyncio pytest-cov ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: DATABASE_URL="$POSTGRES_TEST_URL" alembic upgrade head
      - run: pytest -m "not openai" --cov=app --cov-report=term-missing --cov-report=xml
        env:
          DEMO_MODE: "true"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install pip-audit bandit
      - run: python -m pip install -r requirements-production.txt
      - run: pip-audit --strict
      - run: bandit -q -r app data
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  build:
    name: Build and validate image
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}"
      - run: docker run --rm --entrypoint python "${IMAGE_NAME}:${GITHUB_SHA}" -c "import app.main"
      - run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > nordly-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nordly-image-${{ github.sha }}
          path: nordly-image.tar.gz
          retention-days: 7
          if-no-files-found: error

  staging-smoke:
    name: Staging smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_IMAGE: nordly-support-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nordly-image-${{ github.sha }}
      - run: gunzip -c nordly-image.tar.gz | docker load
      - name: Create staging secret files
        run: |
          mkdir -p ci-secrets
          printf '%s\n' 'ci-openai-placeholder' > ci-secrets/openai_api_key.txt
          printf '%s\n' 'ci-postgres-password' > ci-secrets/postgres_password.txt
          printf '%s\n' 'ci-jwt-secret-at-least-32-bytes-long' > ci-secrets/jwt_secret.txt
          printf '%s\n' 'ci-bootstrap-password' > ci-secrets/bootstrap_admin_password.txt
          printf '%s\n' 'ci-data-encryption-key-at-least-32-bytes' > ci-secrets/encryption_key.txt
          printf '%s\n' 'ci-metrics-token' > ci-secrets/metrics_token.txt
          chmod 600 ci-secrets/*.txt
        env:
          STAGING_OPENAI_API_KEY_FILE: ./ci-secrets/openai_api_key.txt
      - name: Export staging secret paths
        run: |
          echo 'STAGING_OPENAI_API_KEY_FILE=./ci-secrets/openai_api_key.txt' >> "$GITHUB_ENV"
          echo 'STAGING_POSTGRES_PASSWORD_FILE=./ci-secrets/postgres_password.txt' >> "$GITHUB_ENV"
          echo 'STAGING_JWT_SECRET_FILE=./ci-secrets/jwt_secret.txt' >> "$GITHUB_ENV"
          echo 'STAGING_BOOTSTRAP_ADMIN_PASSWORD_FILE=./ci-secrets/bootstrap_admin_password.txt' >> "$GITHUB_ENV"
          echo 'STAGING_ENCRYPTION_KEY_FILE=./ci-secrets/encryption_key.txt' >> "$GITHUB_ENV"
          echo 'STAGING_METRICS_TOKEN_FILE=./ci-secrets/metrics_token.txt' >> "$GITHUB_ENV"
      - run: docker compose -f docker-compose.staging.yml config --quiet
      - run: docker compose -f docker-compose.staging.yml up -d --no-build --wait
      - run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:18000/ready
      - if: always()
        run: docker compose -f docker-compose.staging.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.staging.yml down --volumes

  production-validation:
    name: Manual production validation
    if: github.event_name == 'workflow_dispatch' && inputs.run_production_validation
    needs: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      APP_IMAGE: nordly-support-agent:${{ github.sha }}
      OPENAI_API_KEY_FILE: ./ci-secrets/openai_api_key.txt
      POSTGRES_PASSWORD_FILE: ./ci-secrets/postgres_password.txt
      GRAFANA_ADMIN_PASSWORD_FILE: ./ci-secrets/grafana_admin_password.txt
      JWT_SECRET_FILE: ./ci-secrets/jwt_secret.txt
      BOOTSTRAP_ADMIN_PASSWORD_FILE: ./ci-secrets/bootstrap_admin_password.txt
      ENCRYPTION_KEY_FILE: ./ci-secrets/encryption_key.txt
      METRICS_TOKEN_FILE: ./ci-secrets/metrics_token.txt
      BACKUP_AGE_RECIPIENT: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqp5m0w
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_TENANT: ci-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nordly-image-${{ github.sha }}
      - run: gunzip -c nordly-image.tar.gz | docker load
      - name: Create production validation secret files
        run: |
          mkdir -p ci-secrets
          printf '%s\n' 'validation-openai-placeholder' > ci-secrets/openai_api_key.txt
          printf '%s\n' 'validation-postgres-password' > ci-secrets/postgres_password.txt
          printf '%s\n' 'validation-grafana-password' > ci-secrets/grafana_admin_password.txt
          printf '%s\n' 'validation-jwt-secret-at-least-32-bytes' > ci-secrets/jwt_secret.txt
          printf '%s\n' 'validation-bootstrap-password' > ci-secrets/bootstrap_admin_password.txt
          printf '%s\n' 'validation-data-encryption-key-at-least-32-bytes' > ci-secrets/encryption_key.txt
          printf '%s\n' 'validation-metrics-token' > ci-secrets/metrics_token.txt
          chmod 600 ci-secrets/*.txt
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker image inspect "${APP_IMAGE}" --format '{{json .Config.User}}' | grep -q '10001:10001'
      - run: docker compose -f docker-compose.prod.yml up -d --no-build --wait
      - run: curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:8000/ready
      - run: curl --fail --header 'Authorization: Bearer validation-metrics-token' http://127.0.0.1:8000/metrics | grep -q nordly_http_requests_total
      - if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes
